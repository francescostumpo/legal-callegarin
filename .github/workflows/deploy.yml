name: Publish and deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish immutable image
    if: >-
      github.repository == 'francescostumpo/legal-callegarin' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.verify.outputs.image_ref }}
    env:
      IMAGE_REPOSITORY: ghcr.io/francescostumpo/legal-callegarin
      IMAGE_TAG: ghcr.io/francescostumpo/legal-callegarin:sha-${{ github.sha }}
      IMAGE_VERSION: sha-${{ github.sha }}
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate image identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'invalid GITHUB_SHA\n' >&2
            exit 1
          fi
          expected_tag="$IMAGE_REPOSITORY:sha-$GITHUB_SHA"
          if [[ "$IMAGE_TAG" != "$expected_tag" ]]; then
            printf 'image tag does not match the validated commit\n' >&2
            exit 1
          fi
          if [[ ! "$IMAGE_TAG" =~ ^ghcr\.io/francescostumpo/legal-callegarin:sha-[0-9a-f]{40}$ ]]; then
            printf 'invalid image tag\n' >&2
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          pull: true
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_TAG }}
          build-args: |
            VERSION=${{ env.IMAGE_VERSION }}
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/francescostumpo/legal-callegarin
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_VERSION }}
          provenance: false
          sbom: false

      - name: Verify published digest
        id: verify
        shell: bash
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$BUILD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'build action returned an invalid digest\n' >&2
            exit 1
          fi
          resolved_digest_json="$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "$IMAGE_TAG")"
          if [[ ! "$resolved_digest_json" =~ ^\"sha256:[0-9a-f]{64}\"$ ]]; then
            printf 'registry returned an invalid JSON digest\n' >&2
            exit 1
          fi
          resolved_digest="${resolved_digest_json#\"}"
          resolved_digest="${resolved_digest%\"}"
          if [[ ! "$resolved_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'registry returned an invalid digest\n' >&2
            exit 1
          fi
          if [[ "$resolved_digest" != "$BUILD_DIGEST" ]]; then
            printf 'published digest does not match build output\n' >&2
            exit 1
          fi
          printf 'image_ref=%s@%s\n' "$IMAGE_REPOSITORY" "$BUILD_DIGEST" >> "$GITHUB_OUTPUT"

  deploy-production:
    name: Deploy production digest
    needs: publish
    if: >-
      github.repository == 'francescostumpo/legal-callegarin' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      AZURE_CORE_OUTPUT: none
      IMAGE_REF: ${{ needs.publish.outputs.image_ref }}
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Log in to Azure with OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Validate and deploy immutable digest
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'invalid GITHUB_SHA\n' >&2
            exit 1
          fi
          if [[ ! "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]] || [[ ! "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]; then
            printf 'invalid workflow run identity\n' >&2
            exit 1
          fi
          if [[ ! "$IMAGE_REF" =~ ^ghcr\.io/francescostumpo/legal-callegarin@sha256:[0-9a-f]{64}$ ]]; then
            printf 'invalid immutable image reference\n' >&2
            exit 1
          fi
          revision_suffix="deploy-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ ! "$revision_suffix" =~ ^deploy-[0-9a-f]{12}-[0-9]+-[0-9]+$ ]]; then
            printf 'invalid revision suffix\n' >&2
            exit 1
          fi
          ./scripts/deploy-container-app.sh \
            --subscription-id "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --container-app-name "$AZURE_CONTAINER_APP_NAME" \
            --image-digest "$IMAGE_REF" \
            --revision-suffix "$revision_suffix" \
            --public-base-url "$PUBLIC_BASE_URL"
